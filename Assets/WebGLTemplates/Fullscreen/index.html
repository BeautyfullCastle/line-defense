<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <div id="loading-title">{{{ PRODUCT_NAME }}}</div>
    <div id="loading-bar"><div id="loading-fill"></div></div>
  </div>
  <script>
    (function () {
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#loading-fill");
      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        matchWebGLToCanvasSize: true,
        showBanner: function (msg, type) { if (type === "error") console.error(msg); else console.warn(msg); }
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (progress * 100) + "%";
        }).then(function () {
          loading.style.display = "none";
        }).catch(function (message) {
          loading.querySelector("#loading-title").textContent = String(message);
        });
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
