name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/web-game-design-implementation-0ih0tk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true 로 Pages가 꺼져 있으면 워크플로가 직접 켠다
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 정적 사이트라 빌드가 없다. 저장소 루트를 그대로 올린다.
      - name: Jekyll 처리 비활성화
        run: touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
